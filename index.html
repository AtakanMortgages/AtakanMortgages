
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atakan Mortgages</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
      text-align: center;
    }
    .gold {
      color: #d4af37;
    }
    .form-section {
      background-color: #fff;
      color: #000;
      padding: 2rem;
      max-width: 600px;
      margin: 2rem auto;
      border-radius: 12px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background-color: #d4af37;
      color: black;
      padding: 10px 20px;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }
    img {
      width: 150px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <img src="atakan-mortgages-logo.png" alt="Atakan Mortgages Logo" />
  <h1 class="gold">Welcome to Atakan Mortgages</h1>
  <p>Atakan Mortgages is your trusted partner in navigating the world of home financing...</p>

  <div class="form-section">
    <h2>Client Intake Form</h2>
    <form action="https://formsubmit.co/atakan@searchmortgage.ca" method="POST">
      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="tel" name="phone" placeholder="Phone Number" required />
      <textarea name="message" placeholder="Tell us about your mortgage needs..." required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>

  <a href="https://r.mtg-app.com/atakanhasar" target="_blank">
    <button>Apply Now</button>
  </a>
</body>
</html>
